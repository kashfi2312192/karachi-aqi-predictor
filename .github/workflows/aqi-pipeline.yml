name: Pearls AQI CI/CD Pipeline

on:
  push:
    branches:
      - main

  schedule:
    # Feature pipeline - every hour
    - cron: "17 * * * *"

    # Training pipeline - every day
    - cron: "37 0 * * *"

  workflow_dispatch:

jobs:

  feature-pipeline:
    name: Hourly Feature Pipeline
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run feature engineering
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: |
          python src/features/feature_engineering.py

      - name: Upload features to Hopsworks
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: |
          python src/hopsworks/upload_features.py


  training-pipeline:
    name: Daily Training Pipeline
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '37 0 * * *'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train models
        run: |
          python src/models/train_reference_model.py

      - name: Run prediction pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: |
          python src/pipeline/run_pipeline.py