name: Pearls AQI CI/CD Pipeline

on:
  push:
    branches:
      - master

  schedule:
    # Feature pipeline - every hour at :17 UTC
    - cron: "17 * * * *"

    # Training pipeline - every day at 00:37 UTC
    - cron: "37 0 * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  # ============================================================
  # HOURLY FEATURE PIPELINE
  # ============================================================

  feature-pipeline:

    name: Hourly Feature Pipeline

    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '17 * * * *'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ml.txt


      # ========================================================
      # BACKFILL OPEN-METEO
      # ========================================================

      - name: Backfill Open-Meteo data
        run: |
          python src/data/backfill_openmeteo.py


      # ========================================================
      # FEATURE ENGINEERING
      # ========================================================

      - name: Run feature engineering
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: |
          python src/features/feature_engineering.py


      # ========================================================
      # UPLOAD TO HOPSWORKS
      # ========================================================

      - name: Upload features to Hopsworks
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: |
          python src/hopsworks/upload_features.py


      # ========================================================
      # COMMIT GENERATED FILES
      # ========================================================

      - name: Commit updated feature data
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/ \
            models/feature_info.json

          if git diff --cached --quiet; then

            echo "No feature files changed."

          else

            git commit -m \
              "chore: update hourly AQI features"

            git push

          fi


  # ============================================================
  # DAILY TRAINING PIPELINE
  # ============================================================

  training-pipeline:

    name: Daily Training Pipeline

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '37 0 * * *'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ml.txt


      # ========================================================
      # TRAIN MODELS
      # ========================================================

      - name: Train models
        run: |
          python src/models/train_reference_model.py


      # ========================================================
      # PRODUCTION PREDICTION
      # ========================================================

      - name: Run prediction pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: |
          python src/pipeline/run_pipeline.py


      # ========================================================
      # COMMIT UPDATED RESULTS
      # ========================================================

      - name: Commit updated predictions and results
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/processed/latest_predictions.csv \
            results/ \
            models/feature_info.json

          if git diff --cached --quiet; then

            echo "No prediction or result files changed."

          else

            git commit -m \
              "chore: update daily AQI predictions"

            git push

          fi